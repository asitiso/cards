name: Financial event collector regression
on:
  pull_request:
    paths:
      - 'src/lib/events/**'
      - 'src/lib/ipo/**'
      - 'src/components/ipo-screen.tsx'
      - 'src/routes/index.tsx'
      - 'src/routes/api/cron/**'
      - 'vercel.json'
      - 'scripts/finance-collect-schedule.test.mjs'
      - 'scripts/check-ipo-*.mjs'
      - 'src/lib/change-history/**'
      - 'package.json'
      - '.github/workflows/financial-collector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: node --test scripts/finance-collect-schedule.test.mjs
      - run: node --experimental-strip-types scripts/check-ipo-live-source.mjs
      - run: node --experimental-strip-types scripts/check-ipo-verified-detail.mjs
      - run: node --experimental-strip-types scripts/check-ipo-batch-live.mjs
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --experimental-strip-types --test src/lib/events/quality.test.ts src/lib/events/discover.test.ts src/lib/events/html.test.ts src/lib/events/bank-public-collect.test.ts src/lib/events/broker-public-collect.test.ts src/lib/events/official-public-sources.test.ts src/lib/events/tosssec-collect.test.ts src/lib/events/woori-details.test.ts src/lib/events/open-apply.test.ts src/lib/events/event-navigation.test.ts src/lib/events/daishin-detail.test.ts src/lib/change-history/diff.test.ts
      - run: node --experimental-strip-types --test src/lib/ipo/kind-source.test.ts src/lib/ipo/comm38-source.test.ts src/lib/ipo/terms.server.test.ts
      - run: node --experimental-strip-types --test src/lib/ipo/sonnim-source.test.ts src/lib/ipo/verified-detail.server.test.ts src/lib/ipo/broker-fees.test.ts
      - run: npm run typecheck
      # Diagnostic only: public campaigns can expire or block CI networks even when
      # the collector correctly preserves the previous verified database snapshot.
      # Keep deterministic parsing, type checks and scheduling tests mandatory.
      - run: node --experimental-strip-types scripts/check-public-bank-sources.mjs
        continue-on-error: true
      - run: node --experimental-strip-types scripts/check-public-broker-sources.mjs
        continue-on-error: true
      # Diagnose unavailable official pages without inventing promotions.
      - run: node --experimental-strip-types scripts/check-next-official-sources.mjs
        continue-on-error: true
      - run: node --experimental-strip-types scripts/check-tosssec-source.mjs
        continue-on-error: true

